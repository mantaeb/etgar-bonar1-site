<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A private AI operating layer for your life</title>
  <desc id="desc">A private AI system that remembers, coordinates and stays under your control</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1040 90) rotate(140) scale(600 440)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2B77A" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#F4ECE3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="830" y1="170" x2="1050" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#778D78"/>
      <stop offset="1" stop-color="#33483A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#3F3022" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#F4ECE3"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="92" cy="82" r="10" fill="#BD694C"/>
  <circle cx="92" cy="82" r="20" fill="none" stroke="#BD694C" stroke-opacity="0.22" stroke-width="8"/>
  <text x="128" y="91" fill="#25302A" font-family="Arial, sans-serif" font-size="25" font-weight="700">Private AI</text>
  <text x="82" y="218" fill="#25302A" font-family="Georgia, serif" font-size="68">A private AI operating</text>
  <text x="82" y="300" fill="#25302A" font-family="Georgia, serif" font-size="68">layer for your life.</text>
  <text x="84" y="374" fill="#5E665F" font-family="Arial, sans-serif" font-size="25">It remembers. It coordinates.</text>
  <text x="84" y="411" fill="#5E665F" font-family="Arial, sans-serif" font-size="25">It stays under your control.</text>
  <text x="84" y="531" fill="#964B34" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="2">ETGARBONAR.COM/AI</text>
  <circle cx="950" cy="315" r="190" fill="none" stroke="#5D7563" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="950" cy="315" r="128" fill="none" stroke="#5D7563" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 10"/>
  <circle cx="950" cy="315" r="92" fill="url(#core)" filter="url(#shadow)"/>
  <text x="950" y="309" text-anchor="middle" fill="#F6F0E8" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">PRIVATE</text>
  <text x="950" y="352" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="42">AI</text>
  <g fill="#FFFFFF" stroke="#25302A" stroke-opacity="0.12" filter="url(#shadow)">
    <rect x="886" y="88" width="128" height="52" rx="26"/>
    <rect x="1032" y="289" width="134" height="52" rx="26"/>
    <rect x="886" y="490" width="128" height="52" rx="26"/>
    <rect x="734" y="289" width="134" height="52" rx="26"/>
  </g>
  <g fill="#25302A" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="950" y="121">Remembers</text>
    <text x="1099" y="322">Coordinates</text>
    <text x="950" y="523">Improves</text>
    <text x="801" y="322">Stays yours</text>
  </g>
</svg>
