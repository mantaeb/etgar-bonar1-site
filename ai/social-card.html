<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#18211e}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif}
  .card img{position:absolute;inset:0;width:1200px;height:630px;object-fit:cover;object-position:60% 50%}
  .scrim{position:absolute;inset:0;background:linear-gradient(100deg,rgba(15,20,18,.95) 0%,rgba(15,20,18,.90) 34%,rgba(15,20,18,.62) 57%,rgba(15,20,18,.14) 80%,rgba(15,20,18,0) 100%)}
  .content{position:absolute;left:84px;top:0;height:630px;width:790px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{color:#f4bc7f;font-size:20px;font-weight:700;letter-spacing:3.4px;margin:0 0 30px}
  h1{color:#fffaf0;font-size:58px;line-height:1.14;font-weight:600;letter-spacing:-1.2px;white-space:nowrap;margin:0}
  .sub{color:#cfd8d2;font-size:26px;line-height:1.45;font-weight:400;margin:28px 0 0}
  .rule{width:132px;height:3px;background:#b5682f;margin:38px 0 0}
  .url{color:#f4bc7f;font-size:20px;font-weight:700;letter-spacing:2.2px;margin:26px 0 0}
</style>
<div class="card">
  <img src="assets/personal-os-hero.png" alt="">
  <div class="scrim"></div>
  <div class="content">
    <p class="eyebrow">ETGAR BONAR</p>
    <h1>One builder, no team,<br>real consequences.</h1>
    <p class="sub">A private AI system a whole family depends on,<br>running under real load.</p>
    <div class="rule"></div>
    <p class="url">ETGARBONAR.COM/AI</p>
  </div>
</div>
