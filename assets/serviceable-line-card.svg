<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="cardtitle carddesc">
  <title id="cardtitle">The serviceable line</title>
  <desc id="carddesc">Five bars, one per layer: Findable, Selectable, Integrable, Operable and Fixable, each as long as what the offering asks on that layer. Blue is how far your customers and their AI get on each; a white mark at the end of the blue is the serviceable line; past it, your people step in or the customer is lost. Gold arrows on Findable, Selectable and Operable show where the line is heading. How far does your customer's AI get without you? A point of view by Etgar Bonar.</desc>
