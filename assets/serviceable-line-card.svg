<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="cardtitle carddesc">
  <title id="cardtitle">The Serviceable Line: your competitive gap</title>
  <desc id="carddesc">Your competitive gap shows the revenue at risk or available to win. Five bars, one per layer: Findable, Selectable, Integrable, Operable and Fixable. The white marks, joined by a line, are your Serviceable Line; the red marks are a competitor's. On Findable, Selectable and Fixable the competitor gets farther: revenue at risk. On Integrable and Operable you get farther: available to win. Illustrative, not measured. By Etgar Bonar, Revenue &amp; GTM Executive.</desc>
  <rect width="1200" height="630" fill="#101a1d"/>
  <defs>
    <pattern id="hr" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="4" height="10" fill="#ff4f3f"/></pattern>
    <pattern id="hw" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="4" height="10" fill="#4d8dff"/></pattern>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <text x="72" y="104" font-family="Noto Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#dcb96f">THE SERVICEABLE LINE</text>
  <text x="72" y="186" font-family="Noto Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.5" fill="#f4efe6">Your competitive</text>
  <text x="72" y="250" font-family="Noto Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.5" fill="#f4efe6">gap shows the</text>
  <text x="72" y="314" font-family="Noto Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.5" fill="#f4efe6"><tspan fill="#ff4f3f">revenue at risk</tspan> or</text>
  <text x="72" y="378" font-family="Noto Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.5" fill="#f4efe6"><tspan fill="#4d8dff">available to win</tspan></text>
  <text x="72" y="552" font-family="Noto Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#dcb96f">Etgar Bonar · Revenue &amp; GTM Executive</text>
