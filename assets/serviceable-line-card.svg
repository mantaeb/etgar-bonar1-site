  <rect x="800" y="158.0" width="257.6" height="24" rx="6.0" fill="#dcb96f"/>
  <rect x="800" y="158.0" width="145.6" height="24" rx="6.0" fill="#2f72ff"/>
  <line x1="1057.6" y1="152.0" x2="1057.6" y2="188.0" stroke="#f4efe6" stroke-width="3" stroke-linecap="round"/>
  <text x="786" y="236" text-anchor="end" font-family="Noto Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#a8bdc1">Integrable</text>
  <rect x="800" y="218.0" width="224.0" height="24" rx="6.0" fill="#a8bdc1" fill-opacity=".14" stroke="#a8bdc1" stroke-opacity=".45"/>
  <rect x="800" y="218.0" width="212.8" height="24" rx="6.0" fill="#dcb96f"/>
  <rect x="800" y="218.0" width="168.0" height="24" rx="6.0" fill="#2f72ff"/>
  <line x1="1012.8" y1="212.0" x2="1012.8" y2="248.0" stroke="#f4efe6" stroke-width="3" stroke-linecap="round"/>
  <text x="786" y="296" text-anchor="end" font-family="Noto Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#a8bdc1">Operable</text>
  <rect x="800" y="278.0" width="268.8" height="24" rx="6.0" fill="#a8bdc1" fill-opacity=".14" stroke="#a8bdc1" stroke-opacity=".45"/>
  <rect x="800" y="278.0" width="140.0" height="24" rx="6.0" fill="#dcb96f"/>
  <rect x="800" y="278.0" width="100.8" height="24" rx="6.0" fill="#2f72ff"/>
  <line x1="940.0" y1="272.0" x2="940.0" y2="308.0" stroke="#f4efe6" stroke-width="3" stroke-linecap="round"/>
  <text x="786" y="356" text-anchor="end" font-family="Noto Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#a8bdc1">Fixable</text>
