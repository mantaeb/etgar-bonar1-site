  <text x="724" y="450" font-family="Noto Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#a8bdc1" opacity=".8">The surface: what your offering asks of someone</text>
  <line x1="701" y1="467" x2="701" y2="485" stroke="#f4efe6" stroke-width="3" stroke-linecap="round"/>
